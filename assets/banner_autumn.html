d='';for(let k=0;k<5;k++){const i=k,a=-Math.PI/2+i*2*Math.PI/5,b=a+Math.PI/5;const tip=[s*Math.cos(a),s*Math.sin(a)];const v=[0.38*s*Math.cos(b),0.38*s*Math.sin(b)];
const l1=[0.75*s*Math.cos(a-0.22),0.75*s*Math.sin(a-0.22)],r1=[0.75*s*Math.cos(a+0.22),0.75*s*Math.sin(a+0.22)];

d+=` Q${(l1[0]*0.9).toFixed(1)} ${(l1[1]*0.9).toFixed(1)} ${l1[0].toFixed(1)} ${l1[1].toFixed(1)} L${tip[0].toFixed(1)} ${tip[1].toFixed(1)} L${r1[0].toFixed(1)} ${r1[1].toFixed(1)} Q${(r1[0]*0.9).toFixed(1)} ${(r1[1]*0.9).toFixed(1)} ${v[0].toFixed(1)} ${v[1].toFixed(1)}`;}
